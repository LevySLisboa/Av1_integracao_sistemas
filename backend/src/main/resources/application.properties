spring.application.name=CRUD_AV1

spring.config.import=optional:file:.env[.properties]

# ---------- Banco ----------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Sessão (cookie) ----------
# Sessões ficam na tabela SPRING_SESSION (PostgreSQL)
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Em HTTP local (sem TLS) use COOKIE_SECURE=false
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# Atrás do proxy do Render: usa X-Forwarded-For/Proto para IP real e HTTPS
server.forward-headers-strategy=native

# ---------- Autenticação / 2FA ----------
app.auth.max-falhas-login=5
app.auth.bloqueio-minutos=15
app.twofa.ttl-segundos=300
app.twofa.max-tentativas=5
app.twofa.reenvio-cooldown-segundos=60

# ---------- Rate limiting (requisições por minuto, por IP) ----------
app.ratelimit.auth-por-minuto=${RATE_LIMIT_AUTH:10}
app.ratelimit.geral-por-minuto=${RATE_LIMIT_GERAL:120}

# ---------- Email do código 2FA ----------
# console = imprime o código no log (SOMENTE desenvolvimento)
# resend  = API HTTP do Resend (funciona no Render free)
# smtp    = SMTP (precisa de spring.mail.* e de instância paga no Render)
app.mail.provider=${MAIL_PROVIDER:console}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.resend-api-key=${RESEND_API_KEY:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Dados iniciais (seed) ----------
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.professor-email=${SEED_PROFESSOR_EMAIL:}
app.seed.aluno-email=${SEED_ALUNO_EMAIL:}
app.seed.user-password=${SEED_USER_PASSWORD:}
